services:
  recipebook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8000"  # host port : Uvicorn port inside the container
    volumes:
      - ./data:/app/data
    environment:
      RECIPEBOOK_DATABASE_PATH: /app/data/app.db
    user: "${RECIPEBOOK_UID:-1000}:${RECIPEBOOK_GID:-1000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
