schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  All artifacts and documentation (proposals, specs, design, tasks, ADRs, arc42
  docs, code comments) are written in English.

  We practice Test-Driven Development (TDD) with a strict red-green-refactor cycle:
  write a failing test first, make it pass with the minimal necessary change, then
  refactor. Apply general software engineering best practices throughout (small
  focused changes, no premature abstraction, no dead code, meaningful naming,
  favor simplicity over cleverness). Backend tests use pytest + FastAPI's
  TestClient; frontend tests use Vitest (Vite-native test framework, fits Vue 3).

  Style: write simple technical English with short sentences and no filler.
  Keep artifacts short; every sentence must carry a decision, a requirement, or
  a fact someone needs later. Agent reports are at most 5 lines.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - 'Reference the corresponding GitHub issue number this change addresses
      (e.g. "Closes #1") in the Why or Impact section. Keep the proposal under
      one page.'
  design:
    - "Keep design.md short: one entry per real decision (choice, reason,
      rejected alternative, 5 lines at most). Do not restate the specs or the
      issue, and do not describe code that follows from the specs."
    - Whenever a change involves an architecture decision, an ADR must be created
      in docs/adr/ (Status, Context, Decision, Consequences) *before* the decision
      is implemented, and its status must be "Accepted" before proceeding with
      that decision.
    - Whenever a change involves an architecture decision, the arc42 documentation
      under docs/arc42/adoc/ must be reviewed and updated to reflect the decision
      (e.g. Solution Strategy, Building Block View, Architecture Decisions, Risks,
      as applicable).
  specs:
    - Every scenario must be verifiable by an automated test (pytest or
      Vitest), or explicitly name the manual check that verifies it (e.g. a
      deployment check on the Raspberry Pi).
  tasks:
    - "Implementation tasks must follow TDD: write a failing (red) test first,
      then the minimal code to make it pass (green), then refactor while
      keeping tests green."
    - Every scenario in the delta specs is covered by a task that names the
      scenario. Write one task per behavior ("test, then code"), not separate
      RED and GREEN tasks; TDD order is enforced during apply.
    - Group tasks so that each numbered group can be committed on its own.
    - A task that needs Docker, a server, or another external tool says so, so
      the coordinator can check it before apply starts.
    - The last group is "Verification" and contains a task that runs
      `make check`, plus any manual checks the specs name.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Follow the TDD red-green-refactor cycle for every implementation task.
      - If an architecture decision is made or changed during apply, create/update
        the corresponding ADR in docs/adr/ (status "Accepted") and update
        docs/arc42/adoc/ accordingly before considering the task done.
      - Tick a task only after the test or command that proves it has passed in
        this session; never tick a task based on an assumption.
      - "Commit after each completed task group with a Conventional Commits
        message (feat:, fix:, test:, docs:, chore:)."
      - Tests must be deterministic. Never compare two clock reads for equality
        and never rely on sleeps for ordering; set the time explicitly instead.
      - Never delete, skip, or loosen a test, change an expected value to match
        the code, special-case test inputs, or weaken the check command to make
        a check pass. If a test looks wrong, stop and report it instead.
      - If you are blocked (a tool is missing, the environment is down, a task
        is unclear or impossible), stop and report the blocker. Do not work
        around it.
      - Apply is finished only when `make check` passes twice in a row.
      - Do the Docker or container checks named in the tasks yourself; do not
        leave them for a later phase.
  archive:
    guidance:
      - Archive on the change branch, before the pull request is merged.
      - 'If the change has a review.md, every finding with "Decision: fix" must
        have "Status: fixed"; otherwise stop and report the open findings
        instead of archiving.'
